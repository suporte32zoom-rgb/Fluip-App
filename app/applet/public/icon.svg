<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Blue & Electric Blue Road Gradient -->
    <linearGradient id="roadBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Deep Navy Shadow Road Base -->
    <linearGradient id="roadShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#e2e8f0" stroke-width="4" />

  <!-- Road Arc Emblem -->
  <g filter="url(#softShadow)">
    <!-- Base Navy Curve Under Road -->
    <path d="M 68 316 C 110 316 170 300 208 248 C 248 196 308 160 416 150 C 354 172 266 210 216 278 C 168 344 108 356 68 356 Z" fill="url(#roadShadow)" />

    <!-- Main Blue Highway Sweep -->
    <path d="M 64 316 C 94 220 176 162 424 144 C 346 172 232 222 172 316 C 132 344 96 354 64 354 Z" fill="url(#roadBlue)" />

    <!-- Road Dashed Lane Markings (Pure White) -->
    <path d="M 98 326 C 118 288 148 250 196 216" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 16" />
    <path d="M 210 206 C 254 178 312 162 388 152" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 14" />
  </g>

  <!-- Estrada Pay Brand Text -->
  <g transform="translate(196, 276)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">Estrada<tspan fill="#2563eb">Pay</tspan></text>
  </g>
</svg>
