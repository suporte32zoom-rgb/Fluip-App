<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="fluipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#fluipGrad)" stroke-width="4" opacity="0.3" />

  <!-- Road Perspective -->
  <path d="M 216 160 L 296 160 L 366 380 L 146 380 Z" fill="url(#roadGrad)" />
  <!-- Road Dash -->
  <line x1="256" y1="180" x2="256" y2="230" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="260" x2="256" y2="330" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />

  <!-- Free Flow Overhead Portal Structure -->
  <path d="M 120 280 L 120 170 Q 120 140 150 140 L 362 140 Q 392 140 392 170 L 392 280" fill="none" stroke="url(#fluipGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Contactless Sensor Beam Waves -->
  <path d="M 200 165 Q 256 195 312 165" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 220 195 Q 256 220 292 195" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- Fluip Dynamic "F" Fast Forward Speed Badge -->
  <g transform="translate(256, 386) scale(0.95)">
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="url(#fluipGrad)" stroke-width="8" />
    <!-- Pix / Speed Rhombus -->
    <path d="M 0 -24 L 24 0 L 0 24 L -24 0 Z" fill="url(#fluipGrad)" />
    <path d="M -6 -10 L 6 -10 M -6 0 L 2 0 M -6 10 L -6 -10" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
